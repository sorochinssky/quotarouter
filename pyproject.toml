[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quotarouter"
dynamic = ["version"]
description = "Quota-aware router for web search and page extraction: spend free monthly allowances first and pick the provider by remaining quota, not by a 402 error."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrey Sorochinsky" }]
keywords = ["web-search", "scraping", "quota", "routing", "llm-agents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23", "mypy>=1.11", "build>=1.2", "twine>=5"]

[project.scripts]
quotarouter = "quotarouter.cli:main"

[project.urls]
Homepage = "https://github.com/sorochinssky/quotarouter"
Repository = "https://github.com/sorochinssky/quotarouter"
Changelog = "https://github.com/sorochinssky/quotarouter/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sorochinssky/quotarouter/blob/main/README.md"
Issues = "https://github.com/sorochinssky/quotarouter/issues"

[tool.hatch.version]
path = "quotarouter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["quotarouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real vendor APIs, needs keys; excluded by default (run with -m live)",
    "e2e: drives the plugin through real Hermes tools in an isolated HERMES_HOME; excluded by default (run with -m e2e)",
]
addopts = "-m 'not live and not e2e' --strict-markers"
