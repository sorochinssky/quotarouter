schema: spec-driven

context: |
  quotarouter — a quota-aware router for web search and page extraction (Python >= 3.11).
  The `quotarouter/` package is provider-agnostic and imports no host framework: it is usable
  as a library, as a Hermes plugin, and as an MCP stdio server.
  Integrations live in `quotarouter/integrations/` (`hermes.py`, `mcp.py`) and are imported
  lazily, so a plain `import quotarouter` never drags Hermes in.
  The plugin shim is `hermes_plugin/` (a symlink to the package); installation is a symlink
  into the profile's `plugins/` directory.
  Secrets are environment variables only (`~/.hermes/.env`); they never enter the repository,
  the docs or the reports. Tests that need a vendor key are marked `live` or `e2e`.
  Test levels 1-3 must stay offline (`httpx.MockTransport`); levels 4-5 are marked and do not
  run by default. Any change to the shim, the manifest or the Hermes integration requires
  `python3 -m pytest -m e2e -q`.
  All artifacts — README, docs, OpenSpec, docstrings, commit messages — are in English.

rules:
  proposal:
    - List explicitly what stays with the operator under "Out of scope".
  design:
    - State what counts as evidence for every step of the stand.
  tasks:
    - "Every task carries its check: the command and the expected result."
