schema: spec-driven

context: |
  Плагин-провайдер для Hermes Agent (Python >= 3.11): квотно-осознанный роутер
  web_search/web_extract. Пакет `router/` — самодостаточный, импортируется и без Hermes.
  Шим плагина — `hermes_plugin/` (симлинк на пакет), установка симлинком в plugins профиля.
  Секреты — только переменные окружения (~/.hermes/.env); в репозиторий и в отчёты не пишутся.
  Тесты уровней 1-3 обязаны быть офлайн (httpx.MockTransport), уровни 4-5 помечены live/e2e
  и по умолчанию не бегут. Любая правка шима или провайдера требует прогона e2e:
  `python tests/e2e/harness.py`.
  Язык артефактов и документации — русский; идентификаторы кода и docstring'и — английские.

rules:
  proposal:
    - В разделе "Вне этого изменения" явно перечислить, что остаётся оператору.
  design:
    - Указать, что считается доказательством по каждому шагу стенда.
  tasks:
    - Каждая задача содержит критерий проверки (команда и ожидаемый результат).
